<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B6857">
<meta name="description" content="Denge: pilates, yoga ve kalistenik antrenman uygulaması.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Denge">
<title>Denge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;1,6..96,500&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: mobile-first studio app — four tabs over a fixed bottom bar, full-screen session player on top. */
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --surface-2:#E2E9E5; --ink:#16211D; --muted:#5A6A63; --line:#CDD7D2;
  --accent:#2B6857; --accent-ink:#FFFFFF; --accent-soft:#D3E6DE; --ochre:#B97D12; --ochre-soft:#F4E5C6; --danger:#B3402F;
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --yoga:#6B4F9A; --kal:#2D6A9A; --fig-post:#B8C4BE; --fig-bar:#56645E; --fig-bench:#CDBBA0; --fig-bench-top:#A8916F;
  --fig-suit:#2B6857; --fig-suit-far:#1D4A3D; --fig-skin:#D8A887; --fig-skin-far:#B58566; --fig-hair:#3B2A22; --fig-mat:#C5D3CC; --fig-line:#B4C1BA; --fig-ball:#D39A2E; --fig-ball-hi:#F6DDA8; --fig-band:#C0503C; --fig-wall:#DDE4E0; --stage:#F7FAF8;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161F1B; --surface-2:#1E2824; --ink:#E4ECE8; --muted:#93A39C; --line:#2A3631;
  --accent:#72C2A8; --accent-ink:#0C1914; --accent-soft:#1D3A30; --ochre:#E6B252; --ochre-soft:#3A2E16; --danger:#EF7F6B; --yoga:#B9A2E0; --kal:#8DBCE3; --fig-post:#34423C; --fig-bar:#9AAAA3; --fig-bench:#4A3F33; --fig-bench-top:#6B5A47; --fig-suit:#5FB497; --fig-suit-far:#3B7A65; --fig-skin:#D7A887; --fig-skin-far:#A97D60; --fig-hair:#6A4A3A; --fig-mat:#2B3A34; --fig-line:#3A4943; --fig-ball:#D9A23A; --fig-ball-hi:#F3D39A; --fig-band:#EF7F6B; --fig-wall:#1C2622; --stage:#131B18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161F1B; --surface-2:#1E2824; --ink:#E4ECE8; --muted:#93A39C; --line:#2A3631;
  --accent:#72C2A8; --accent-ink:#0C1914; --accent-soft:#1D3A30; --ochre:#E6B252; --ochre-soft:#3A2E16; --danger:#EF7F6B; --yoga:#B9A2E0; --kal:#8DBCE3; --fig-post:#34423C; --fig-bar:#9AAAA3; --fig-bench:#4A3F33; --fig-bench-top:#6B5A47; --fig-suit:#5FB497; --fig-suit-far:#3B7A65; --fig-skin:#D7A887; --fig-skin-far:#A97D60; --fig-hair:#6A4A3A; --fig-mat:#2B3A34; --fig-line:#3A4943; --fig-ball:#D9A23A; --fig-ball-hi:#F3D39A; --fig-band:#EF7F6B; --fig-wall:#1C2622; --stage:#131B18; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{text-wrap:balance;margin:0}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:30px;letter-spacing:-.01em;line-height:1.1}
.brand b{font-style:normal;font-weight:600;color:var(--accent)}
.brand{display:flex;align-items:center;gap:8px}
.brand .logo{width:24px;height:34px;color:var(--accent);flex:0 0 auto}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.cloud i{background:var(--accent)}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.h2{font-family:var(--f-display);font-weight:500;font-size:24px;line-height:1.15;margin:28px 0 12px}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.num{font-variant-numeric:tabular-nums}

/* Today hero */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero .eyebrow{color:inherit;opacity:.8}
.hero h1{font-family:var(--f-display);font-weight:500;font-size:34px;line-height:1.05}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;opacity:.9}
.hero .spine{position:absolute;right:-6px;top:10px;width:130px;opacity:.16;pointer-events:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;font-weight:600;font-size:15px;background:var(--accent);color:var(--accent-ink)}
.btn.light{background:var(--accent-ink);color:var(--accent)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.quiet{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{padding:8px 14px;font-size:13.5px}
.btn:active{transform:scale(.98)}
.hero .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 2px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.day .dn{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.day .dd{font-size:15px;font-weight:600}
.day .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line)}
.day.plan .dot{border-color:var(--accent)}
.day.done .dot{background:var(--accent);border-color:var(--accent)}
.day.today{border-color:var(--ink)}
.day .pl{font-size:10px;color:var(--muted);line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;padding:0 2px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-display);font-weight:500;font-size:28px;line-height:1;font-variant-numeric:lining-nums tabular-nums}
.stat span{font-size:12px;color:var(--muted)}

.principle{border-left:3px solid var(--ochre);padding:4px 0 4px 14px}
.principle h3{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:22px}
.principle p{margin:4px 0 0;color:var(--muted);max-width:60ch}

/* Lists */
.card{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;gap:14px;align-items:center;border:0;text-align:left;width:100%}
.card:hover{background:color-mix(in srgb,var(--surface) 92%,var(--accent))}
.card .glyph{flex:0 0 52px;height:52px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--accent)}
.card .glyph svg{width:40px;height:22px}
.card .body{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.card .title{font-weight:600;font-size:16px;line-height:1.25}
.card .sub{font-size:13px;color:var(--muted);line-height:1.35}
.card .dur{font-size:13px;font-weight:600;white-space:nowrap;color:var(--muted)}
.prog{flex-direction:column;align-items:stretch;gap:10px;padding:16px}
.prog .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.prog .ph h3{font-family:var(--f-display);font-weight:500;font-size:22px;line-height:1.15}
.prog p{margin:0;font-size:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.chip.lv1{background:var(--accent-soft);color:var(--accent)}
.chip.lv2{background:var(--ochre-soft);color:var(--ochre)}
.chip.lv3{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.filters{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.fchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.fchips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:600;white-space:nowrap;color:var(--muted)}
.fchips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font:inherit;color:var(--ink)}
.search::placeholder{color:var(--muted)}
.empty{background:var(--surface);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-weight:500;font-size:20px;margin-bottom:4px}

/* History */
.chart{background:var(--surface);border-radius:var(--r);padding:14px 10px 8px}
.chart svg{width:100%;height:auto;display:block}
.cal{background:var(--surface);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .ch{font-size:10.5px;font-weight:600;color:var(--muted);text-align:center;text-transform:uppercase}
.cal .cd{aspect-ratio:1;max-width:100%;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cal .cd.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.cal .cd.t{outline:1.5px solid var(--ink);outline-offset:-1.5px}
.cal .cd.fut{opacity:.35}
.hist{background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:12px}
.hist .when{flex:0 0 46px;text-align:center;line-height:1.1}
.hist .when b{display:block;font-family:var(--f-display);font-size:22px;font-weight:500}
.hist .when span{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600}
.hist .body{flex:1;min-width:0}
.hist .title{font-weight:600}
.hist .sub{font-size:13px;color:var(--muted)}
.hist .x{border:0;background:transparent;color:var(--muted);padding:6px;border-radius:8px;font-size:13px}
.settings{background:var(--surface);border-radius:var(--r);padding:4px 14px}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.set:last-child{border-bottom:0}

/* Bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:600;border-radius:10px}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--accent)}

/* Sheet */
.backdrop{position:fixed;inset:0;background:rgba(8,14,12,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88%;overflow-y:auto;border-radius:22px 22px 0 0;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-family:var(--f-display);font-weight:500;font-size:28px;line-height:1.1}
.sheet .en{font-style:italic;color:var(--muted);font-family:var(--f-display);font-size:16px;margin-top:2px}
.sheet ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.sheet ol li{padding-left:4px;max-width:62ch}
.breath{background:var(--ochre-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:14px}
.breath b{color:var(--ochre)}
.order{display:flex;flex-direction:column;gap:0;background:var(--surface);border-radius:var(--r);padding:2px 14px}
.order div{display:flex;gap:10px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.order div:last-child{border-bottom:0}
.order em{font-style:normal;color:var(--muted);font-size:12px;font-weight:600;width:20px;flex:0 0 20px;font-variant-numeric:tabular-nums}
.order span{flex:1;min-width:0}
.order small{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.sheet .actions{position:sticky;bottom:0;padding-top:14px;background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:10px}
.sheet .actions .btn{flex:1}
@keyframes up{from{transform:translateY(30px)}to{transform:none}}

/* Player */
.player{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));overflow-y:auto}
.player.rest{background:var(--surface-2)}
.pin{max-width:520px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;gap:14px}
.ptop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ptop .pt{font-size:13px;color:var(--muted);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{border:0;background:var(--surface);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:0 0 40px}
.iconbtn svg{width:20px;height:20px}
.pbar{display:flex;gap:3px}
.pbar i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.pbar i.d{background:var(--accent)}
.pbar i.c{background:var(--ochre)}
.phase{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);text-align:center}
.player.rest .phase{color:var(--ochre)}
.pname{font-family:var(--f-display);font-weight:500;font-size:32px;line-height:1.08;text-align:center}
.pside{text-align:center;color:var(--muted);font-weight:600;margin-top:-8px}
.ring{position:relative;width:min(66vw,260px);aspect-ratio:1;margin:4px auto;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bgc{fill:none;stroke:var(--line);stroke-width:8}
.ring .fgc{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .2s linear}
.player.rest .ring .fgc{stroke:var(--ochre)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ring .time{font-family:var(--f-display);font-size:64px;font-weight:500;line-height:1;font-variant-numeric:lining-nums tabular-nums}
.ring .sm{font-size:13px;color:var(--muted);font-weight:600}
.pacer{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600}
.pacer .orb{width:18px;height:18px;border-radius:50%;background:var(--ochre);transition:transform 2.6s ease-in-out}
.pacer .orb.in{transform:scale(1.7)}
.cues{background:var(--surface);border-radius:var(--r);padding:12px 16px}
.cues ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:14px}
.next{background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center}
.next .glyph{color:var(--accent)}
.next .glyph svg{width:40px;height:22px}
.controls{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:auto;padding-top:6px}
.controls .iconbtn{width:52px;height:52px;flex-basis:52px}
.play{width:76px;height:76px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.play svg{width:30px;height:30px}
.confirm{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.confirm .row{display:flex;gap:8px;flex-wrap:wrap}
.summary{display:flex;flex-direction:column;gap:16px;text-align:center;align-items:center;padding-top:6vh}
.summary h2{font-family:var(--f-display);font-weight:500;font-size:36px;line-height:1.05}
.summary .stats{width:100%}
.feel{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.feel button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px}
.feel button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}

/* Figures, ratings, timelines, motivation */
.fig-suit{fill:var(--fig-suit)}.fig-suit-far{fill:var(--fig-suit-far)}.fig-skin{fill:var(--fig-skin)}.fig-skin-far{fill:var(--fig-skin-far)}.fig-hair{fill:var(--fig-hair)}
.card .glyph{flex:0 0 76px;height:52px;background:var(--stage);overflow:hidden}
.card .glyph svg.thumb{width:100%;height:100%;display:block}
.stage{background:var(--stage);border-radius:18px;position:relative;overflow:hidden;border:1px solid var(--line)}
.stage svg{display:block;width:100%;height:auto}
.stage .vlabel{position:absolute;left:12px;top:9px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.player .stage svg{max-height:32vh;margin:0 auto}
.diff{display:inline-flex;gap:2px;vertical-align:middle;margin-left:2px}
.diff i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.diff i.on{background:var(--ochre)}
.rates{display:grid;gap:9px;background:var(--surface);border-radius:var(--r);padding:14px}
.rate{display:grid;grid-template-columns:minmax(0,108px) 1fr 30px;align-items:center;gap:10px;font-size:13.5px}
.rate .bar{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.rate .bar i{height:8px;border-radius:2px;background:var(--surface-2)}
.rate .bar i.on{background:var(--accent)}
.rate.z .bar i.on{background:var(--ochre)}
.rate b{font-variant-numeric:tabular-nums;text-align:right;color:var(--muted);font-weight:600;font-size:12.5px}
.sec{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.ticks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.ticks li{display:flex;gap:10px;align-items:flex-start;max-width:62ch}
.ic{flex:0 0 20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;margin-top:1px}
.ic.ok{background:var(--accent-soft);color:var(--accent)}
.ic.no{background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)}
.warn{background:color-mix(in srgb,var(--danger) 8%,var(--surface));border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:14px;border-left:3px solid var(--danger)}

.cday span{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.cday small{font-size:10px;color:var(--muted)}
.cday.rest{background:transparent;border-style:dashed;color:var(--muted)}
.cday.rest.ok{opacity:.6}
.cday.done{background:var(--accent-soft);border-color:transparent}
.cday.done em{color:var(--accent)}
.cday.open{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cday.open small{color:var(--accent);font-weight:700}
.cday.miss small{color:var(--ochre)}
.cday.lock{opacity:.55}
.cday.today{outline:2px solid var(--ink);outline-offset:1px}
.recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.rec{background:var(--surface);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px}
.rec .ml{font-size:12px;color:var(--muted);font-weight:600}
.rec b{font-family:var(--f-display);font-weight:500;font-size:26px;line-height:1.1}
.rec b small{font-family:var(--f-body);font-size:12px;color:var(--muted)}
.celeb{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(10,20,16,.45);padding:16px;animation:cfade .25s ease}
.cbox{position:relative;background:var(--bg);border-radius:20px;padding:26px 22px 20px;max-width:340px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.cbox h3{font-family:var(--f-display);font-weight:500;font-size:24px;margin:4px 0 0}
.cbox p{margin:0;font-size:15px}
.cbox .btn{margin-top:10px}
.cbox .medal{width:56px;height:56px;font-size:26px}
.cbox i{position:absolute;left:50%;top:44px;width:8px;height:8px;border-radius:2px;background:var(--c);transform:rotate(var(--a)) translateY(0);opacity:0;animation:cpop 1s ease-out forwards}
@keyframes cpop{0%{opacity:1;transform:rotate(var(--a)) translateY(0)}100%{opacity:0;transform:rotate(var(--a)) translateY(calc(-1 * var(--d)))}}
@keyframes cfade{from{opacity:0}to{opacity:1}}
.genctl{display:flex;flex-direction:column;gap:6px}
.genctl .flabel{margin-top:6px}
.genctl .fchips.regs{flex-wrap:wrap}
.aicard{display:flex;flex-direction:column;gap:8px;background:var(--surface);border-radius:var(--r);padding:14px 16px;margin-top:14px;border:1px solid var(--line)}
.aicard b{font-size:16px}
.aicard textarea{resize:vertical;min-height:56px}
.aicard .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.aicard .row .muted{font-size:13.5px}
.aichips{display:flex;gap:6px;flex-wrap:wrap}
.aichips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--muted)}
.aichips button:hover{border-color:var(--accent);color:var(--ink)}
.ask{display:flex;flex-direction:column;gap:8px}
.askrow{display:flex;gap:8px;align-items:center}
.askrow .search{flex:1;min-width:0}
.askout{font-size:14.5px;line-height:1.5}
.askout p{margin:6px 0}
.askout ul{margin:6px 0;padding-left:20px}
.music{margin-top:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.musicout{width:100%;font-size:14px}
.musicout p{margin:4px 0}
.splist{display:flex;flex-direction:column;gap:6px;width:100%}
.splist a{display:grid;grid-template-columns:1fr auto;gap:2px 10px;background:var(--surface);border-radius:12px;padding:10px 12px;text-decoration:none;color:var(--ink);border:1px solid var(--line)}
.splist a span{grid-column:1;font-size:12.5px;color:var(--muted)}
.splist a em{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;font-size:12.5px;font-weight:700;color:#1A9E48}
.xstrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.xcard{flex:0 0 118px;display:flex;flex-direction:column;gap:4px;text-align:left;border:0;background:var(--surface);border-radius:12px;padding:10px 12px;color:var(--ink);font-size:13px;font-weight:600;line-height:1.25}
.xcard b{font-family:var(--f-display);font-weight:500;font-size:24px;color:var(--accent)}
.xcard b small{font-family:var(--f-body);font-size:12px;color:var(--muted)}
.genbtn{display:flex;gap:12px;align-items:center;width:100%;margin-top:10px;text-align:left;border:0;border-radius:var(--r);padding:14px 16px;background:var(--accent-soft);color:var(--ink)}
.genbtn .gi{width:40px;height:40px;flex:0 0 40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:20px;font-weight:700}
.genbtn span:last-child{display:flex;flex-direction:column;gap:2px}
.genbtn small{color:var(--muted);font-size:13px}
.newprog+.newprog{margin-top:0}

.bsex{display:flex;flex-direction:column;gap:6px;margin:4px 0 12px}
.bsex .seg{flex-wrap:wrap;border-radius:14px}
.bcalc{margin-top:14px;background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.55}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (min-width:560px){.pname{font-size:38px}}

<script>
/* Pilates figure engine: 2D articulated body, keyframe animation, SVG output. */
(function(root){
"use strict";
const L={l1:22,l2:30,nk:8,hr:11,ua:28,fa:26,th:42,sh:40,ft:13};
const FLOOR=172;
function dir(a){const r=a*Math.PI/180;return [Math.cos(r),Math.sin(r)]}
function pt(p,a,l){const d=dir(a);return [p[0]+d[0]*l,p[1]+d[1]*l]}
function add(p,v,k){return [p[0]+v[0]*k,p[1]+v[1]*k]}
const f1=n=>Math.round(n*10)/10;
function circ(c,r){return 'M'+f1(c[0]-r)+' '+f1(c[1])+'a'+r+' '+r+' 0 1 0 '+f1(2*r)+' 0a'+r+' '+r+' 0 1 0 '+f1(-2*r)+' 0Z'}
function cap(A,B,ra,rb){
  const dx=B[0]-A[0],dy=B[1]-A[1],len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len;
  return 'M'+f1(A[0]+nx*ra)+' '+f1(A[1]+ny*ra)+'L'+f1(B[0]+nx*rb)+' '+f1(B[1]+ny*rb)+'L'+f1(B[0]-nx*rb)+' '+f1(B[1]-ny*rb)+'L'+f1(A[0]-nx*ra)+' '+f1(A[1]-ny*ra)+'Z'+circ(A,ra)+circ(B,rb);
}
const DEF={x:160,y:160,rot:0,s1:180,s2:180,n:180,fs:1,a1:0,e1:0,a2:0,e2:0,h1:0,k1:0,f1:-90,h2:0,k2:0,f2:-90,af:1,lf:1,sw:0,hw:0,bx:0,by:0};
function solve(q){
  q=Object.assign({},DEF,q);
  const r=q.rot,P=[q.x,q.y];
  const W=pt(P,q.s1+r,L.l1), S=pt(W,q.s2+r,L.l2);
  const N=pt(S,q.n+r,L.nk), H=pt(S,q.n+r,L.nk+L.hr);
  const sp=dir(q.s2+r+90), hp=dir(q.s1+r+90);
  const S1=add(S,sp,q.sw), S2=add(S,sp,-q.sw), P1=add(P,hp,q.hw), P2=add(P,hp,-q.hw);
  const E1=pt(S1,q.a1+r,L.ua*q.af), D1=pt(E1,q.e1+r,L.fa*q.af);

}

/* Hand constraint: keep hands on a bar / floor point using 2-bone IK (spec.grip=[x,y,bend]) */
function constrain(q,spec){
  if(!spec||!spec.grip) return q;
  const g=spec.grip; q=Object.assign({},DEF,q); const j=solve(q); const u=L.ua*q.af, l=L.fa*q.af;
  [['S1','a1','e1'],['S2','a2','e2']].forEach(([sk,ak,ek])=>{const S=j[sk];const dx=g[0]-S[0],dy=g[1]-S[1];let d=Math.hypot(dx,dy);if(d>u+l+3)return;d=Math.min(d,u+l-0.01);

function limbArm(j,E,D,S){return cap(S,E,5,4.1)+cap(E,D,4.1,3.2)+circ(D,3.6)}

/* Returns SVG markup for one pose. ex: exercise anim spec (for props/view). */

  if(spec.dips){const d=spec.dips;out+='<rect x="'+(d[0]+8)+'" y="'+d[2]+'" width="5" height="'+(FLOOR+5-d[2])+'" fill="var(--fig-post)"/><rect x="'+(d[1]-13)+'" y="'+d[2]+'" width="5" height="'+(FLOOR+5-d[2])+'" fill="var(--fig-post)"/><rect x="'+d[0]+'" y="'+(d[2]-3)+'" width="'+(d[1]-d[0])+'" height="6" rx="3" fill="var(--fig-bar)"/>';}
  if(spec.bar){const b=spec.bar;out+='<rect x="'+(b[0]-2)+'" y="'+b[1]+'" width="4" height="'+(FLOOR+5-b[1])+'" fill="var(--fig-post)" opacity=".55"/>';}
  if(spec.backwall) out+='<rect x="0" y="-60" width="320" height="'+(FLOOR+66)+'" fill="var(--fig-wall)"/>';
  if(spec.seat){const c=spec.seat,x0=c[0],x1=c[1],y=c[2];out+='<rect x="'+(x0+2)+'" y="'+(y-54)+'" width="6" height="'+(FLOOR+5-y+54)+'" rx="3" fill="var(--fig-bench-top)"/><rect x="'+(x1-8)+'" y="'+y+'" width="5" height="'+(FLOOR+5-y)+'" rx="2" fill="var(--fig-bench-top)"/><rect x="'+x0+'" y="'+y+'" width="'+(x1-x0)+'" height="7" rx="3" fill="var(--fig-bench)"/>';}
  if(spec.wall) out+='<rect x="0" y="6" width="'+spec.wall+'" height="'+(FLOOR+6)+'" fill="var(--fig-wall)"/><rect x="'+(spec.wall-2)+'" y="6" width="2" height="'+(FLOOR+6)+'" fill="var(--fig-line)"/>';
  if(spec.view==='top') out+='<rect x="18" y="92" width="284" height="96" rx="8" fill="var(--fig-mat)"/>';
  else out+='<rect x="0" y="'+(FLOOR+5)+'" width="320" height="2" fill="var(--fig-line)"/>'+(spec.mat===false?'':'<rect x="22" y="'+FLOOR+'" width="276" height="6" rx="3" fill="var(--fig-mat)"/>');
  const ball=spec.ball?'<g>'+'<circle cx="'+f1(j.q.bx)+'" cy="'+f1(j.q.by)+'" r="'+spec.ball+'" fill="var(--fig-ball)"/>'+
    '<path d="M'+f1(j.q.bx-spec.ball*.92)+' '+f1(j.q.by)+'a'+spec.ball*.92+' '+spec.ball*.38+' 0 0 0 '+f1(spec.ball*1.84)+' 0" fill="none" stroke="var(--fig-ball-hi)" stroke-width="1.6"/>'+
    '<circle cx="'+f1(j.q.bx-spec.ball*.36)+'" cy="'+f1(j.q.by-spec.ball*.4)+'" r="'+f1(spec.ball*.16)+'" fill="var(--fig-ball-hi)"/></g>':'';
  const farCls=front?'fig-skin':'fig-skin-far', farSuit=front?'fig-suit':'fig-suit-far';
  // far limbs
  out+='<path class="'+farCls+'" d="'+limbArm(j,j.E2,j.D2,j.S2)+'"/>';
  out+='<path class="'+farSuit+'" d="'+limbLeg(j.P2,j.K2,j.A2,j.T2)+'"/>';
  if(spec.ball && !spec.ballFront) out+=ball;
  // torso
  const tw=front?[14,12.5,15.5,14.5]:[12.5,11.2,12.6,13];
  out+='<path class="fig-skin" d="'+cap(j.S,j.N,4.6,4.4)+'"/>';
  out+='<path class="fig-suit" d="'+circ(j.P,tw[3])+cap(j.P,j.W,tw[0],tw[1])+cap(j.W,j.S,tw[1],tw[2])+'"/>';
  // head
  if(front){
    out+='<path class="fig-hair" d="'+circ(add(j.H,j.nd,1.8),11)+circ(add(j.H,j.nd,11.5),4.6)+'"/>';
    out+='<path class="fig-skin" d="'+circ(add(j.H,j.nd,-1.3),9.7)+'"/>';

    out+='<path class="fig-hair" d="'+circ(j.H,11)+circ(add(add(j.H,j.face,-9),j.nd,2.5),4.7)+'"/>';

  out+='<path class="fig-suit" d="'+limbLeg(j.P1,j.K1,j.A1,j.T1)+'"/>';
  out+='<path class="fig-skin" d="'+limbArm(j,j.E1,j.D1,j.S1)+'"/>';

    out+='<circle cx="'+b[0]+'" cy="'+b[1]+'" r="5" fill="var(--fig-bar)"/>';}
  if(spec.band&&spec.band!=='bar'){
    let a,b;
    if(spec.band==='hands'){a=j.D1;b=j.D2}

}
/* Animation sampling: frames [{...pose, t:transitionSec, h:holdSec}] */
function ease(x){return .5-.5*Math.cos(Math.PI*x)}
function lerp(a,b,k){const o={};const keys=new Set(Object.keys(a).concat(Object.keys(b)));keys.forEach(key=>{if(key==='t'||key==='h'||typeof (key in a?a[key]:b[key])!=='number')return;const va=key in a?a[key]:DEF[key],vb=key in b?b[key]:DEF[key];o[key]=va+(vb-va)*k});return o}
function cycle(frames){return frames.reduce((s,f)=>s+(f.t||1)+(f.h||0),0)}
function sample(frames,time){
  const tot=cycle(frames); let t=time%tot;
  for(let i=0;i<frames.length;i++){
    const f=frames[i], prev=frames[(i-1+frames.length)%frames.length], tr=f.t||1, h=f.h||0;

function frameAt(frames,time){
  const tot=cycle(frames); let t=time%tot;
  for(let i=0;i<frames.length;i++){const f=frames[i],tr=f.t||1,h=f.h||0; if(t<tr+h) return t<tr*0.5?(i-1+frames.length)%frames.length:i; t-=tr+h;}

/* ---------- 3D view: lift the 2D pose into 3D and project with yaw/pitch ---------- */
const SW3=13,HW3=8;
function hull(pts){pts=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);const lo=[],up=[];
  for(const p of pts){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p)}
  for(let i=pts.length-1;i>=0;i--){const p=pts[i];while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p)}
  up.pop();lo.pop();return lo.concat(up)}
function poly(ps){return 'M'+ps.map(p=>f1(p[0])+' '+f1(p[1])).join('L')+'Z'}
function render3(q,spec,yaw,pitch,cx){
  spec=spec||{}; cx=cx==null?160:cx; q=constrain(q,spec);
  const j=solve(q), front=!!spec.front, top=spec.view==='top';
  const ry=yaw*Math.PI/180, rp=pitch*Math.PI/180, cy=Math.cos(ry), sy=Math.sin(ry), cp=Math.cos(rp), sp=Math.sin(rp);
  const pr=(X,Y,Z)=>{const x=X-cx, xr=x*cy-Z*sy, zr=x*sy+Z*cy; return [cx+xr, FLOOR+(Y-FLOOR)*cp+zr*sp, zr*cp-(Y-FLOOR)*sp];};
  const rv=v=>{const zr=v[0]*sy+v[2]*cy; return [v[0]*cy-v[2]*sy, v[1]*cp+zr*sp, zr*cp-v[1]*sp];};
  const qq=j.q;
  // lift
  let P3;
  if(top){
    const lv={P:0,W:0,S:0,N:-1,H:-2,S1:-8,E1:-8,D1:-8,P1:-8,K1:-8,A1:-8,T1:-8,S2:6,E2:6,D2:6,P2:6,K2:6,A2:6,T2:6};
    P3=k=>[j[k][0],156+(lv[k]||0),j[k][1]-140];
  } else if(front){
    const fa=Math.sqrt(Math.max(0,1-qq.af*qq.af)), fl=Math.sqrt(Math.max(0,1-qq.lf*qq.lf));
    const z={E1:L.ua*fa,D1:(L.ua+L.fa)*fa,E2:L.ua*fa,D2:(L.ua+L.fa)*fa,K1:L.th*fl,A1:L.th*fl,T1:L.th*fl,K2:L.th*fl,A2:L.th*fl,T2:L.th*fl};
    P3=k=>[j[k][0],j[k][1],z[k]||0];
  } else {
    const z={S1:SW3,E1:SW3,D1:SW3,S2:-SW3,E2:-SW3,D2:-SW3,P1:HW3,K1:HW3,A1:HW3,T1:HW3,P2:-HW3,K2:-HW3,A2:-HW3,T2:-HW3};
    P3=k=>{const p=j[k];const zz=z[k]||0;
      if(k==='S1'||k==='S2') return [j.S[0],j.S[1],zz];
      if(k==='P1'||k==='P2') return [j.P[0],j.P[1],zz];

const legs=(h,k,f,h2,k2,f2)=>({h1:h,k1:k,f1:f,h2:h2==null?h:h2,k2:k2==null?k:k2,f2:f2==null?f:f2});
function ik(S,T,u,l,bend){const dx=T[0]-S[0],dy=T[1]-S[1];let d=Math.hypot(dx,dy);d=Math.min(d,u+l-0.01);const base=Math.atan2(dy,dx);const al=Math.acos(Math.max(-1,Math.min(1,(u*u+d*d-l*l)/(2*u*d))));const a=base+bend*al;const E=[S[0]+u*Math.cos(a),S[1]+u*Math.sin(a)];return [deg(a),deg(Math.atan2(T[1]-E[1],T[0]-E[0]))]}
const leg=(n,P,An,bend,f)=>{const r=ik(P,An,42,40,bend);const o={};o['h'+n]=r[0];o['k'+n]=r[1];if(f!=null)o['f'+n]=f;return o};
const both=(P,An,bend,f)=>F(leg(1,P,An,bend,f),leg(2,P,An,bend,f));

function lsGet(k,def){try{const v=localStorage.getItem(k);return v==null?def:JSON.parse(v)}catch(e){return def}}

const store = {sessions:lsGet('pd.sessions',[]), mode:'local', db:null, uid:null, mastery:lsGet('pd.mastery',{}), favs:Object.assign({ex:{},prog:{}},lsGet('pd.favs',{}))};
async function saveFavs(){lsSet('pd.favs',store.favs);if(store.db){try{await store.db.collection('data/users/'+store.uid).doc('favs').set({ex:store.favs.ex,prog:store.favs.prog})}catch(e){}}}

function saveLocal(){lsSet('pd.sessions',store.sessions)}
function sortSessions(){store.sessions.sort((a,b)=>b.startedAt.localeCompare(a.startedAt))}
function clean(s){const o=Object.assign({},s);delete o.synced;delete o.id;return o}

async function initDb(){
  try{
    if(!window.claude || typeof window.claude.use!=='function') return;
    const [db,user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if(!db || !user) return;
    const uid = await user.id();
    if(!uid) return;
    store.db = db; store.uid = uid;
    const col = db.collection('data/users/'+uid);
    let pushed=false;
    col.onSnapshot(async snap=>{
      const adoc = snap.docs.find(d=>d.id==='adapt'); if(adoc&&adoc.data().a){store.adapt=Object.assign({},adoc.data().a);lsSet('pd.adapt',store.adapt);}
      const crdoc = snap.docs.find(d=>d.id==='course'); if(crdoc&&crdoc.data().c){const cc=crdoc.data().c;store.course=cc.id?Object.assign({},cc,{done:Object.assign({},cc.done||{})}):null;lsSet('pd.course',store.course);}
      const pdoc = snap.docs.find(d=>d.id==='profile'); if(pdoc&&pdoc.data().p){store.profile=pdoc.data().p;lsSet('pd.profile',store.profile);}
      const cdoc = snap.docs.find(d=>d.id==='customs'); if(cdoc&&Array.isArray(cdoc.data().list)){store.customs=cdoc.data().list;lsSet('pd.customs',store.customs);syncCustoms();}
      const mds = snap.docs.filter(d=>d.id.startsWith('m_')).map(d=>Object.assign({},d.data(),{id:d.id})); if(mds.length){const ids=new Set(mds.map(m=>m.id));store.meas=mds.concat(store.meas.filter(m=>!ids.has(m.id)));lsSet('pd.meas',store.meas);}
      const fdoc = snap.docs.find(d=>d.id==='favs'); if(fdoc){const fd=fdoc.data();store.favs={ex:Object.assign({},fd.ex||{}),prog:Object.assign({},fd.prog||{})};lsSet('pd.favs',store.favs);}
      const mdoc = snap.docs.find(d=>d.id==='mastery'); if(mdoc&&mdoc.data().m){store.mastery=Object.assign({},mdoc.data().m);lsSet('pd.mastery',store.mastery);}
      const remote = snap.docs.filter(d=>d.id.startsWith('s_')).map(d=>Object.assign({},d.data(),{id:d.id,synced:true}));
      const ids = new Set(remote.map(r=>r.id));
      const pending = store.sessions.filter(s=>!s.synced && !ids.has(s.id));
      store.sessions = remote.concat(pending); sortSessions(); saveLocal();
      if(!snap.metadata.fromCache){
        store.mode='cloud';
        if(!pushed){pushed=true; for(const s of pending){try{await col.doc(s.id).set(clean(s)); s.synced=true;}catch(e){}} saveLocal();}
      }
      if(!overlayOpen()) render();
      else updateSync();
    }, ()=>{store.db=null; store.mode='local'; updateSync();});
  }catch(e){}
}
async function persistSession(s){
  s.synced=false;
  store.sessions.push(s); sortSessions(); saveLocal();
  if(store.db){
    try{await store.db.collection('data/users/'+store.uid).doc(s.id).set(clean(s)); s.synced=true; saveLocal();}
    catch(e){toast('Hesaba kaydedilemedi; bu cihazda saklandı.')}
  }
}
async function removeSession(id){
  store.sessions = store.sessions.filter(s=>s.id!==id); saveLocal();
  if(store.db){try{await store.db.collection('data/users/'+store.uid).doc(id).delete()}catch(e){}}
}

function stepsFor(ids,o){
  o=o||{}; const ad=Math.max(-2,Math.min(2,o.adapt!=null?o.adapt:((o.id&&store.adapt)?(store.adapt[o.id]||0):0)));
  const R=Math.round((o.rest!=null?o.rest:settings.rest)*(1-0.15*ad));
  const st=[{type:'prep',ex:ids[0],k:0,secs:5}];
  ids.forEach((id,k)=>{
    const e=EX[id], secs=Math.round((o.hold||e.s)*(1+0.1*ad)), sides=e.side?['Sağ taraf','Sol taraf']:[null], nset=(!o.hold&&e.cal)?Math.max(1,e.cal.sets+(ad>=2?1:0)-(ad<=-2&&e.cal.sets>2?1:0)):1;
    for(let si=1;si<=nset;si++){
      sides.forEach((sd,j)=>{st.push({type:'work',ex:id,k,side:sd,secs,set:si,sets:nset}); if(j<sides.length-1) st.push({type:'switch',ex:id,k,secs:5,set:si,sets:nset});});
      if(si<nset) st.push({type:'setrest',ex:id,k,secs:Math.round((e.cal.rest||60)*(1-0.15*ad)),set:si+1,sets:nset});
    }
    if(k<ids.length-1&&R>0) st.push({type:'rest',ex:ids[k+1],k:k+1,secs:R});
  });
  return st;
}
function progSecs(ids,o){return stepsFor(ids,o).reduce((a,s)=>a+s.secs,0)}

function viewName(id){const s=PANIM[id].spec;return s.view==='top'?'Üstten görünüm':(s.front?'Önden görünüm':'Yandan görünüm')}
function peakPose(id){const a=PANIM[id];return a.frames[a.peak||0]}
function bboxOf(id){
  const a=PANIM[id],q=peakPose(id),j=PFig.solve(q);let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  ['P','W','S','H','E1','D1','E2','D2','K1','A1','T1','K2','A2','T2'].forEach(k=>{const p=j[k];x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1])});
  if(a.spec.ball){const r=a.spec.ball;x0=Math.min(x0,q.bx-r);x1=Math.max(x1,q.bx+r);y0=Math.min(y0,q.by-r);y1=Math.max(y1,q.by+r)}
  x0-=16;y0-=16;x1+=16;y1+=12;let w=x1-x0,h=y1-y0;const R=76/52;
  if(w/h<R){const nw=h*R;x0-=(nw-w)/2;w=nw}else{const nh=w/R;y0-=(nh-h)/2;h=nh}
  return [x0,y0,w,h].map(n=>n.toFixed(1)).join(' ');
}

function sessionsByDay(){const m={};store.sessions.forEach(s=>{const k=dkey(new Date(s.startedAt));(m[k]=m[k]||[]).push(s)});return m}
function weekStats(){
  const mon=mondayOf(new Date()); let sec=0,cnt=0;
  store.sessions.forEach(s=>{const t=new Date(s.startedAt); if(t>=mon){sec+=s.durationSec;cnt++}});
  return {min:Math.round(sec/60),cnt};
}

    const d=addDays(mon,i); const k=dkey(d); const pl=plan[i];

    '<div class="meta"><span class="num">'+fmtMin(progSecs(p.ids,p))+' dk</span><span>'+p.ids.length+' hareket</span><span>'+eqOf(p.ids).map(e=>EQ[e]).join(' · ')+'</span></div>'+
    (restDay&&!doneToday?'<div style="font-size:14px;opacity:.9">Plan dinlenme diyor. Canın isterse hafif bir sabah akışı yapabilirsin.</div>':'')+

    '<div class="row"><button class="btn light" data-start="'+p.id+'">'+(doneToday?'Yine de başla':'Seansı başlat')+'</button><button class="btn sm" style="background:transparent;color:inherit;border:1px solid currentColor" data-prog="'+p.id+'">Hareketleri gör</button></div>'+
  '</section>'+
  courseToday()+profileCard()+bodyPrompt()+measReminderCard()+aiAskCard()+quickBlock()+
  '<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:28px 0 12px"><h2 class="h2" style="margin:0">Bu hafta</h2>'+

  '<div class="stats" style="margin-top:12px"><div class="stat"><b>'+ws.min+'</b><span>dk bu hafta</span></div><div class="stat"><b>'+ws.cnt+'</b><span>seans bu hafta</span></div><div class="stat"><b>'+streak()+'</b><span>gün seri</span></div></div>'+

  favBlock()+
  '<h2 class="h2">Bugün neresi?</h2><p class="muted" style="margin:-4px 0 10px;font-size:14px">Geliştirmek istediğin bölgeyi seç; o bölgeye çalışan hareketleri ve hazır bir seans getireyim.</p><div class="regpick">'+REGIONS.map(x=>'<button data-goreg="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>'+

const lib = {ds:'all', eq:'all', lv:0, q:'', reg:'', fav:false};
function tagHas(e,keys){return e.t.some(t=>{const s=t.toLocaleLowerCase('tr-TR');return !s.includes('açma')&&keys.some(k=>s.includes(k))})}
const REGIONS=[
 ['karin','Karın & core',(e,r)=>Math.max(r[1],tagHas(e,['karın','core'])?4:0)],
 ['sirt','Sırt & duruş',(e,r)=>Math.max(r[2],tagHas(e,['sırt','duruş','latissimus'])?4:0)],
 ['gogus','Göğüs',(e,r)=>tagHas(e,['göğüs'])?Math.max(3,r[6]):0],
 ['omuz','Omuz',(e,r)=>tagHas(e,['omuz'])?Math.max(3,r[6]):0],
 ['kol','Kollar',(e,r)=>tagHas(e,['kol','biseps','kavrama'])?Math.max(3,r[6]):0],
 ['kalca','Kalça',(e,r)=>tagHas(e,['kalça','glute'])?Math.max(3,r[3]):0],
 ['bacak','Bacak',(e,r)=>tagHas(e,['bacak','uyluk','baldır','ayak bileği'])?Math.max(3,r[3]):(r[3]>=4?r[3]:0)],
 ['esneklik','Esneklik',(e,r)=>r[4]],
 ['denge','Denge',(e,r)=>r[5]]
];
const RMAP=Object.fromEntries(REGIONS.map(x=>[x[0],x]));
function regScore(id,reg){const R=RMAP[reg];return R?R[2](EX[id],PINFO[id].r):0}
function regionIds(){
  const q=lib.q.trim().toLocaleLowerCase('tr-TR');
  let items=Object.keys(EX).filter(id=>{const e=EX[id];return (!lib.fav||isFav('ex',id))&&(lib.ds==='all'||dsOf(id)===lib.ds)&&(lib.eq==='all'||e.eq===lib.eq)&&(!lib.lv||e.lv===lib.lv)&&(!q||(e.n+' '+e.en+' '+e.t.join(' ')).toLocaleLowerCase('tr-TR').includes(q))});
  if(lib.reg){items=items.filter(id=>regScore(id,lib.reg)>=3).sort((a,b)=>regScore(b,lib.reg)-regScore(a,lib.reg)||EX[a].lv-EX[b].lv)}
  return items;
}
function regionSession(){
  const maxLv=lib.lv||Math.min(3,settings.level+1);
  const pool=regionIds().filter(id=>(lib.lv?EX[id].lv===lib.lv:EX[id].lv<=maxLv)&&!['catcow','childpose','savasana'].includes(id));
  const main=pool.slice(0,7);
  if(!main.length) return null;
  const cool=lib.ds==='yoga'?'savasana':'childpose';
  return ['catcow'].concat(main,[cool]);
}
function regionBanner(){
  if(!lib.reg) return '';
  const ids=regionSession(); const name=RMAP[lib.reg][1];
  if(!ids) return '';
  return '<div class="regban"><div><span class="eyebrow">'+esc(name)+' için hazır seans</span><b>'+(ids.length-2)+' hareket · yaklaşık '+fmtMin(progSecs(ids))+' dk</b><span class="muted">Kedi-İnek ile ısınma, bölgeye en çok çalışan hareketler, '+(ids[ids.length-1]==='savasana'?'Ölü Pozu':'Çocuk Pozu')+' ile soğuma. Seviyene ve seçtiğin filtrelere göre.</span></div><button class="btn" data-regstart="1">Başlat</button></div>';
}

function weeklyChart(){

  const mins=weeks.map(w=>Math.round(w.sec/60)); const max=Math.max(30,...mins); const nice=Math.ceil(max/30)*30;

    else g+='<rect x="'+x.toFixed(1)+'" y="'+(pt+ih-2)+'" width="'+bw.toFixed(1)+'" height="2" rx="1" fill="var(--line)"/>';
    if(m>0) g+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-6).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">'+m+'</text>';

  });
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Son 8 haftada haftalık pilates dakikası">'+g+'</svg>';

  let ni=P.i+dir;

  P.i=ni; P.half=false; P.rem=P.steps[ni].secs; P.lastWhole=Math.ceil(P.rem);

const POSORD={standing:0,kneeling:1,prone:2,side:3,seated:4,supine:5};
function genLv(){return GEN.lv||Math.min(3,(store.profile&&store.profile.level)||settings.level||1)}
function genPool(){const lv=genLv(),eq=Object.assign({mat:1,duvar:1,sandalye:1},ownedEq());
  return Object.keys(EX).filter(id=>{const e=EX[id];if(WARMSET.has(id)||!PANIM[id]||!eq[e.eq]||e.lv>lv)return false;if(GEN.ds==='low')return !!e.low;if(e.low)return false;return GEN.ds==='mix'||dsOf(id)===GEN.ds})}
function genWrap(main){if(GEN.ds==='low')return main.includes('chaircatcow')?main:['chaircatcow'].concat(main);const cool=GEN.ds==='yoga'?'savasana':'childpose';if(GEN.min<=10)return ['catcow'].concat(main,[cool]);return wrapWU(main)}
function generate(){const pool=genPool();const w=id=>GEN.reg?Math.pow(Math.max(0,regScore(id,GEN.reg)-1),2):1;
  const order=pool.map(id=>[id,w(id)]).filter(x=>x[1]>0).map(([id,ww])=>[id,Math.pow(Math.random(),1/ww)]).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  const target=GEN.min*60;let main=[];
  for(const id of order){if(main.length>=14)break;const trial=main.concat([id]);if(progSecs(genWrap(trial))<=target*1.1)main=trial;if(progSecs(genWrap(main))>=target*.92)break}
  main.sort((a,b)=>(POSORD[EX[a].pos]||0)-(POSORD[EX[b].pos]||0));
  GEN.ids=main.length?genWrap(main):null;GEN.src='gen';GEN.title=(GEN.reg?RMAP[GEN.reg][1]:({mix:'Karışık',pilates:'Pilates',yoga:'Yoga',kal:'Kalistenik',low:'Duvar & sandalye'})[GEN.ds])+' · '+GEN.min+' dk';GEN.note=''}
function sheetGen(){const ai=GEN.src==='ai';const secs=GEN.ids?progSecs(GEN.ids):0;
  const ctl=ai?'':'<div class="genctl"><span class="flabel">Süre</span><div class="fchips">'+[5,10,15,20,30,45].map(m=>'<button data-gmin="'+m+'" aria-pressed="'+(GEN.min===m)+'">'+m+' dk</button>').join('')+'</div>'+
    '<span class="flabel">Odak</span><div class="fchips regs">'+[['','Tüm vücut']].concat(REGIONS.map(x=>[x[0],x[1]])).map(([k,l])=>'<button data-greg="'+k+'" aria-pressed="'+(GEN.reg===k)+'">'+l+'</button>').join('')+'</div>'+
    '<span class="flabel">Tür</span><div class="fchips">'+[['mix','Karışık'],['pilates','Pilates'],['yoga','Yoga'],['kal','Kalistenik'],['low','Duvar & sandalye']].map(([k,l])=>'<button data-gds="'+k+'" aria-pressed="'+(GEN.ds===k)+'">'+l+'</button>').join('')+'</div>'+
    '<span class="flabel">Seviye</span><div class="fchips">'+[[1,'Başlangıç'],[2,'Orta'],[3,'İleri']].map(([k,l])=>'<button data-glv="'+k+'" aria-pressed="'+(genLv()===k)+'">'+l+'</button>').join('')+'</div></div>';
  openSheet('<span class="eyebrow">'+(ai?'Claude\'un hazırladığı seans':'Anında seans oluşturucu')+'</span><h2 style="margin:4px 0 8px">'+esc(GEN.title||'Anında seans')+'</h2>'+
   (ai?'<p class="muted" style="margin:0 0 6px;font-size:13.5px">İsteğin: "'+esc(GEN.req)+'"</p>'+(GEN.note?'<div class="breath">'+esc(GEN.note)+'</div>':''):'<p class="muted" style="margin:0 0 12px;font-size:14px">Süreyi, odağı ve türü seç; her seferinde sahip olduğun ekipmana ve seviyene göre yeni bir seans kurulur.</p>')+ctl+
   (GEN.ids?'<div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:14px"><span class="flabel">'+GEN.ids.length+' hareket</span><span class="muted num" style="font-size:13px">yaklaşık '+fmtMin(secs)+' dk</span></div><div class="order">'+GEN.ids.map((x,i)=>'<div data-ex="'+x+'" style="cursor:pointer"><em>'+(i+1)+'</em><span>'+esc(EX[x].n)+(EX[x].side?' <span class="muted">(iki taraf)</span>':'')+'</span><small>'+(EX[x].cal?calTxt(EX[x]):((EX[x].side?EX[x].s*2:EX[x].s)+' sn'))+'</small></div>').join('')+'</div>':'<div class="empty" style="margin-top:12px"><b>Bu seçimle seans kurulamadı</b>Seviyeyi yükselt, odağı ya da türü değiştir.</div>')+
   musicBlock('gen')+
   '<div class="actions">'+(ai?'<button class="btn ghost" data-gsave="1">Kaydet</button>':'<button class="btn ghost" data-groll="1">↻ Yeniden</button>')+'<button class="btn" data-gstart="1" '+(GEN.ids?'':'disabled')+'>Başlat</button></div>'+
   (ai?'':(GEN.ids?'<button class="btn quiet" data-gsave="1" style="width:100%;margin-top:8px">Programlarıma kaydet</button>':'')))}

/* ---------- Claude (sample) & Spotify (mcp) ---------- */
const AI={s:null,m:null,ready:false,off:false};
async function initAI(){try{if(!window.claude||typeof window.claude.use!=='function')return;
  const [s,m]=await Promise.all([window.claude.use('sample').catch(()=>null),window.claude.use('mcp').catch(()=>null)]);AI.s=s||null;AI.m=m||null}catch(e){}
  AI.ready=true;if(AI.s||AI.m){if(!overlayOpen())render();else needsRender=true}}
function aiErr(e){const c=e&&e.code;if(c==='not_granted'||c==='sampling_disabled'||c==='capability_disabled'||c==='capability_removed'||c==='not_declared'){AI.off=true;return 'Claude erişimine izin verilmedi; bu özellik bu görünümde kapalı.'}
  if(c==='rate_limited')return 'Claude kullanım sınırına ulaşıldı; biraz sonra tekrar dene.';if(c==='cancelled')return 'İptal edildi.';if(c==='invalid_json')return 'Yanıt anlaşılamadı; isteği biraz daha kısa yazıp tekrar dene.';if(c==='refused')return 'Bu isteğe yanıt verilemedi; farklı bir şekilde sor.';return 'Şu an yanıt alınamadı; tekrar dene.'}
function aiOn(){return !!AI.s&&!AI.off}
function mdLite(t){return esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').split(/\n{2,}/).map(p=>{const L=p.split('\n');if(L.every(l=>/^\s*([-•*]|\d+\.)\s/.test(l)))return '<ul>'+L.map(l=>'<li>'+l.replace(/^\s*([-•*]|\d+\.)\s/,'')+'</li>').join('')+'</ul>';return '<p>'+L.join('<br>')+'</p>'}).join('')}
function catalogTxt(){const eq=Object.assign({mat:1,duvar:1,sandalye:1},ownedEq());return Object.keys(EX).filter(id=>PANIM[id]&&eq[EX[id].eq]).map(id=>{const e=EX[id];return id+' | '+e.n+' | '+(e.low?'duvar/sandalye':DSN[dsOf(id)])+' | sv'+e.lv+' | '+(e.side?2*e.s:e.s)+'sn'+(e.cal?' ('+e.cal.sets+'x'+e.cal.reps+')':'')+' | '+e.t.join(', ')}).join('\n')}
function profTxt(){const pr=store.profile||{};return 'Seviye: '+LV[pr.level||settings.level||1]+'. Hedefler: '+((pr.goals||[]).map(g=>GMAP[g][1]).join(', ')||'belirtilmemiş')+'. Ekipman: '+Object.keys(ownedEq()).map(k=>EQ[k]).join(', ')+', duvar, sandalye.'+bodyTxt()}
function aiAskCard(){if(!aiOn())return '';return '<div class="aicard"><span class="eyebrow">Claude ile seans</span><b>Nasıl bir seans istersin?</b><textarea id="aiReq" class="search" rows="2" maxlength="300" placeholder="Örn. Belim ağrıyor, 15 dakikalık hafif bir seans">'+esc(GEN.req)+'</textarea><div class="aichips">'+['Sabah 10 dk enerji','Belim ağrıyor, 15 dk hafif','20 dk kalça ve bacak','Uyumadan önce gevşeme'].map(x=>'<button data-aiex="'+esc(x)+'">'+esc(x)+'</button>').join('')+'</div><div class="row"><button class="btn" data-aireq="1">Seansı hazırla</button><span class="muted" id="aiReqOut" aria-live="polite"></span></div></div>'}
async function aiRequest(btn){const ta=$('#aiReq'),out=$('#aiReqOut');const q=(ta&&ta.value.trim())||'';if(!q){if(out)out.textContent='Önce ne istediğini yaz.';return}GEN.req=q;
  btn.disabled=true;if(out)out.textContent='Claude seansını hazırlıyor…';
  const prompt='Sen deneyimli bir pilates, yoga ve kalistenik eğitmenisin. Kullanıcının isteğine göre AŞAĞIDAKİ KATALOGDAN bir seans kur.\n\nKullanıcı: '+profTxt()+'\n\nKatalog (id | ad | tür | seviye | süre | hedef bölgeler):\n'+catalogTxt()+
   '\n\nKurallar:\n- Yalnızca katalogdaki id\'leri kullan, hiçbir id uydurma.\n- Isınma hareketiyle başla, gevşeme hareketiyle bitir.\n- İstenen süreye uy: her hareketin süresine ek olarak hareketler arası 15 sn dinlenme var. Süre belirtilmemişse yaklaşık 15 dakika.\n- Ağrı ya da sakatlık belirtilmişse o bölgeyi zorlayan, ileri seviye ve sıçramalı hareketleri seçme; yumuşak, kontrollü hareketler seç.\n- Kullanıcının seviyesinin üstüne en fazla bir seviye çık.\n\nİstek: "'+q+'"\n\nYanıtı yalnızca şu JSON nesnesi olarak ver:\n{"baslik":"kısa Türkçe seans adı","not":"1-2 cümle Türkçe: seansın mantığı ve dikkat edilecek nokta; ağrı belirtildiyse keskin ağrıda durmasını ve geçmeyen ağrıda hekime danışmasını hatırlat","ids":["id1","id2"]}';
  try{const r=await AI.s.json(prompt);const ids=(r&&Array.isArray(r.ids)?r.ids:[]).filter(x=>typeof x==='string'&&EX[x]&&PANIM[x]);
    if(ids.length<2)throw {code:'invalid_json'};
    GEN.ids=ids;GEN.title=String(r.baslik||'Claude seansı').slice(0,60);GEN.note=String(r.not||'').slice(0,400);GEN.src='ai';if(out)out.textContent='';showSheet('gen:ai')}
  catch(e){if(out)out.textContent=aiErr(e);if(AI.off){const c=$('.aicard');if(c)c.remove()}}
  finally{btn.disabled=false}}
function askBlock(id){if(!aiOn())return '';return '<div class="sec">Claude\'a sor</div><div class="ask"><div class="aichips">'+['Daha kolay versiyonu nasıl?','Daha zor versiyonu nasıl?','Hangi kasları çalıştırır?','Belim / dizim ağrıyorsa yapabilir miyim?'].map(x=>'<button data-askq="'+esc(x)+'">'+esc(x)+'</button>').join('')+'</div><div class="askrow"><input class="search" id="askIn" maxlength="240" placeholder="Bu hareketle ilgili sorunu yaz"><button class="btn sm" data-ask="'+id+'">Sor</button></div><div class="askout" id="askOut" aria-live="polite"></div></div>'}
let askCtl=null;
async function aiAsk(id,q){const out=$('#askOut');if(!out||!q)return;try{askCtl&&askCtl.abort()}catch(e){}askCtl=new AbortController();const e=EX[id],I=PINFO[id];
  out.innerHTML='<p class="muted">Claude yanıtlıyor…</p>';
  const prompt='Sen deneyimli bir pilates, yoga ve kalistenik eğitmenisin. Kullanıcı şu hareketle ilgili soru soruyor; Türkçe, sıcak ve kısa (en fazla 140 kelime) yanıt ver. Gerekirse madde işareti kullan. Tanı koyma; ağrı sorulursa güvenli alternatif öner ve keskin ya da geçmeyen ağrıda hekime/fizyoterapiste danışmasını söyle.\n\nHareket: '+e.n+' ('+e.en+'), '+DSN[dsOf(id)]+', seviye '+LV[e.lv]+', ekipman '+EQ[e.eq]+'.\nHedef: '+e.t.join(', ')+'\nNasıl yapılır: '+e.d.join(' ')+'\nNefes: '+e.b+'\nDikkat: '+I.dikkat.join(' ')+'\nSık hatalar: '+I.hata.join('; ')+'\nRiskler: '+I.risk.join(' ')+'\nKullanıcı: '+profTxt()+'\n\nSoru: '+q;
  try{const r=await AI.s(prompt,{signal:askCtl.signal,onText:({text})=>{if(out.isConnected)out.innerHTML=mdLite(text)}});if(out.isConnected)out.innerHTML=mdLite(r.text)+(r.truncated?'<p class="muted">…</p>':'')}
  catch(err){if(out.isConnected&&err&&err.code!=='cancelled')out.innerHTML='<p class="muted">'+esc(aiErr(err))+'</p>'}}
function reviewBlock(){if(!aiOn())return '';const last=lsGet('pd.review',null);
  return '<h2 class="h2">Haftalık değerlendirme</h2><div class="aicard"><span class="muted" style="font-size:14px">Claude son haftalarındaki seanslarına, hislerine ve ölçümlerine bakıp ilerlemeni yorumlar, gelecek hafta için öneri verir.</span><div class="row"><button class="btn" data-review="1">'+(last?'Yeni değerlendirme al':'Değerlendirme al')+'</button></div><div class="askout" id="revOut" aria-live="polite">'+(last?'<p class="muted" style="font-size:12.5px">'+new Date(last.date).toLocaleDateString('tr-TR',{day:'numeric',month:'long'})+' tarihli değerlendirme</p>'+mdLite(last.text):'')+'</div></div>'}
async function aiReview(btn){const out=$('#revOut');if(!out)return;btn.disabled=true;out.innerHTML='<p class="muted">Claude verilerine bakıyor…</p>';
  const since=addDays(new Date(),-28);const S=store.sessions.filter(s=>new Date(s.startedAt)>=since).slice(0,40);
  const wk=[0,1,2,3].map(i=>{const m=addDays(mondayOf(new Date()),-7*i),e=addDays(m,7);const ss=store.sessions.filter(s=>{const t=new Date(s.startedAt);return t>=m&&t<e});return (i===0?'Bu hafta':i+' hafta önce')+': '+ss.length+' seans, '+Math.round(ss.reduce((a,s)=>a+s.durationSec,0)/60)+' dk'}).join('\n');
  const M=store.meas.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(-4).map(m=>m.date.slice(0,10)+': '+METRICS.filter(x=>m[x[0]]!=null&&m[x[0]]!=='').map(x=>x[1]+' '+m[x[0]]+' '+x[2]).join(', ')).join('\n')||'yok';
  const R=recordsNow();const ci=courseInfo();
  const prompt='Sen kullanıcının kişisel pilates/yoga/kalistenik koçusun. Aşağıdaki verilere bakarak Türkçe, motive edici ama dürüst bir haftalık değerlendirme yaz (en fazla 200 kelime). Yapı: 1) Bu hafta ne iyi gitti (somut rakamlarla), 2) Dikkat çeken bir örüntü (ör. "Zorlayıcı" hisler, aksayan günler, ölçüm değişimi), 3) Gelecek hafta için 2-3 somut öneri (uygulamadaki program adlarıyla). Veri azsa bunu nazikçe söyle ve başlangıç önerisi ver. Tıbbi tanı koyma.\n\nKullanıcı: '+profTxt()+'\nHaftalık plan: '+activePlan().map((p,i)=>DAYS[i]+' '+(p&&PMAP[p]?PMAP[p].n:'dinlenme')).join(', ')+'\nGüncel seri: '+streak()+' gün (planlı dinlenme günleri seriyi bozmaz). En uzun seri: '+(R.streak?R.streak.v:0)+' gün.\n'+(ci?'Aktif kurs: '+ci.c.n+', '+ci.nd+'/'+ci.ss.length+' ders tamam.\n':'')+'\nHaftalık toplamlar:\n'+wk+'\n\nSon 4 haftanın seansları (tarih | program | dk | his):\n'+(S.map(s=>s.startedAt.slice(0,10)+' | '+s.name+' | '+fmtMin(s.durationSec)+' | '+(s.feel||'-')).join('\n')||'yok')+'\n\nÖlçümler:\n'+M;
  try{const r=await AI.s(prompt,{onText:({text})=>{if(out.isConnected)out.innerHTML=mdLite(text)}});lsSet('pd.review',{date:new Date().toISOString(),text:r.text});if(out.isConnected)out.innerHTML=mdLite(r.text)}
  catch(err){if(out.isConnected)out.innerHTML='<p class="muted">'+esc(aiErr(err))+'</p>'}finally{btn.disabled=false}}

function musicBlock(key){if(!AI.m)return '';return '<div class="music"><button class="btn ghost sm" data-music="'+key+'"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#1DB954"/><path d="M6.5 9.3c3.6-1.1 7.6-.8 11 1M7.2 12.4c3-.8 6.3-.5 9 .9M7.8 15.3c2.4-.6 4.8-.4 7 .7" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>Seans müziği (Spotify)</button><div class="musicout" aria-live="polite"></div></div>'}
function musicInfo(key){let n,min,ds;if(key==='gen'){n=GEN.title||'Anında seans';min=fmtMin(GEN.ids?progSecs(GEN.ids):900);ds=GEN.ds}else{const p=PMAP[key];n=p.n;min=fmtMin(progSecs(p.ids,p));ds=p.hold?'hiit':(p.ds||'pilates')}
  const mood=ds==='kal'||ds==='hiit'?'enerjik, tempolu':ds==='yoga'||ds==='low'?'sakin, yavaş tempolu':'akıcı, orta tempolu ve odaklanmayı kolaylaştıran';return {n,min,mood,kind:ds==='kal'||ds==='hiit'?'antrenman':ds==='yoga'?'yoga':'pilates'}}
function spPayload(r){let p=r&&(r.payload!==undefined?r.payload:r);if(typeof p==='string'){try{p=JSON.parse(p)}catch(e){}}return p}
function spCollect(p){const ents=[],codes=[];(function walk(o,d){if(!o||d>6)return;if(Array.isArray(o)){o.forEach(x=>walk(x,d+1));return}if(typeof o!=='object')return;
  if(typeof o.code==='string')codes.push(o.code);if(typeof o.url==='string'&&/^https:\/\/open\.spotify\.com\//.test(o.url)&&o.name)ents.push(o);Object.values(o).forEach(v=>{if(v&&typeof v==='object')walk(v,d+1)})})(p,0);
  const seen=new Set();return {ents:ents.filter(e=>!seen.has(e.url)&&seen.add(e.url)),codes}}
function spList(ents){return '<div class="splist">'+ents.slice(0,6).map(e=>'<a href="'+esc(e.url)+'" target="_blank" rel="noopener"><b>'+esc(e.name)+'</b><span>'+esc(((e.creators||e.artists||[]).map(c=>c.name).filter(Boolean).join(', '))||(e.entity_type==='COLLECTION'?'Çalma listesi':''))+'</span><em>Spotify\'da aç ↗</em></a>').join('')+'</div>'}
function spErr(e){const c=e&&e.code;if(c==='server_not_connected')return 'Spotify bağlı değil. claude.ai Ayarlar → Bağlayıcılar bölümünden Spotify\'ı ekleyip tekrar dene.';if(c==='needs_reauth')return 'Spotify bağlantının süresi dolmuş. claude.ai Ayarlar → Bağlayıcılar bölümünden Spotify\'ı yeniden bağla.';
  if(c==='not_in_manifest'||c==='blocked_by_policy')return 'Bu sayfanın Spotify\'a erişimine izin verilmedi.';if(c==='selection_required')return 'Birden fazla Spotify bağlantın var; claude.ai\'nin sorduğu seçimi yapıp tekrar dene.';if(c==='tool_error')return 'Spotify isteği tamamlayamadı: '+((e&&e.message)||'bilinmeyen hata');return 'Spotify\'a şu an ulaşılamadı; biraz sonra tekrar dene.'}
async function spotifyFor(key,btn){const box=btn.parentElement.querySelector('.musicout');if(!box||!AI.m)return;const mi=musicInfo(key);btn.disabled=true;box.innerHTML='<p class="muted">Spotify\'da '+mi.min+' dakikalık çalma listen hazırlanıyor…</p>';
  try{const r=await AI.m.callTool('Spotify','generate_playlist',{prompt:'Oluştur: '+mi.min+' dakikalık bir '+mi.kind+' seansı ("'+mi.n+'") için '+mi.mood+' enstrümantal bir çalma listesi',language:'tr-TR'});
    let {ents,codes}=spCollect(spPayload(r));const premium=codes.some(c=>/NOT_SUBSCRIBED|PREMIUM/.test(c));
    if(!ents.length){const s=await AI.m.callTool('Spotify','search',{prompt:mi.kind+' '+mi.mood+' enstrümantal çalma listesi',language:'tr-TR',limit:6});ents=spCollect(spPayload(s)).ents}
    if(!ents.length){box.innerHTML='<p class="muted">Uygun bir liste bulunamadı.</p>';return}
    box.innerHTML=(premium?'<p class="muted">Yeni çalma listesi oluşturmak Spotify Premium gerektiriyor. Seansına uygun hazır listeler:</p>':'<p class="muted">Çalma listen hazır, Spotify hesabında da kayıtlı:</p>')+spList(premium?ents:ents.slice(0,1))}
  catch(e){box.innerHTML='<p class="muted">'+esc(spErr(e))+'</p>'}finally{btn.disabled=false}}

/* ---------- voice settings ---------- */
let VOICES=[];
function loadVoices(){try{VOICES=speechSynthesis.getVoices()||[]}catch(e){VOICES=[]}const sel=$('#vVoice');if(sel&&sel.options.length<=1&&VOICES.length)sel.outerHTML=voiceSelect()}

function voiceSettings(){if(settings.voice===false)return '';const r=settings.vrate||1;const lv=settings.vlevel||'normal';
  return '<div class="set"><span>Konuşma hızı <b class="num" id="vRateL">'+r.toFixed(2).replace(/0$/,'')+'×</b></span><input type="range" id="vRate" min="0.7" max="1.4" step="0.05" value="'+r+'" aria-label="Konuşma hızı" style="flex:1 1 140px;max-width:220px"></div>'+
   '<div class="set"><span>Ses</span>'+voiceSelect()+'</div>'+
   '<div class="set"><span>Anlatım ayrıntısı</span><div class="seg" role="group" aria-label="Anlatım ayrıntısı">'+[['min','Az'],['normal','Normal'],['detay','Detaylı']].map(([k,l])=>'<button data-vlevel="'+k+'" aria-pressed="'+(lv===k)+'">'+l+'</button>').join('')+'</div></div>'+
   '<div class="set"><span class="muted" style="font-size:13px;max-width:34ch">'+({min:'Yalnızca hareket adı ve süre.',normal:'Hareket adı, süre, geri sayım ve bir dikkat ipucu.',detay:'Ek olarak ilk adım, nefes ritmi ve hareket ortasında ikinci bir ipucu.'})[lv]+'</span><button class="btn sm ghost" data-vtest="1">Dinle</button></div>'}

/* ---------- Today: quick block ---------- */
function quickBlock(){const ex=PROGRAMS.filter(p=>p.express);
  return '<h2 class="h2">Vaktin az mı?</h2><div class="xstrip">'+ex.map(p=>'<button class="xcard" data-start="'+p.id+'"><b class="num">'+fmtMin(progSecs(p.ids,p))+'<small> dk</small></b><span>'+esc(p.n.replace(/^Ekspres · /,''))+'</span></button>').join('')+'</div>'+
  '<button class="genbtn" data-gen="1"><span class="gi">↻</span><span><b>Anında seans oluştur</b><small>Süre, odak ve türü seç; her seferinde yeni bir seans</small></span></button>'}

/* ================= v11: body profile (sex, age, height, weight, body fat, muscle) ================= */
const BKEYS=['by','h','w','fat','muscle','neck','waist','hip'];
let BODYD={};
function navyFat(sex,h,waist,neck,hip){const L=Math.log10;let v=null;
  if(!h||!waist||!neck)return null;
  if(sex==='e'&&waist>neck)v=495/(1.0324-0.19077*L(waist-neck)+0.15456*L(h))-450;
  if(sex==='k'&&hip&&waist+hip>neck)v=495/(1.29579-0.35004*L(waist+hip-neck)+0.22100*L(h))-450;
  return v==null||!isFinite(v)?null:Math.round(Math.max(3,Math.min(60,v))*10)/10}
function bmiCat(b){return b<18.5?'Zayıf':b<25?'Normal':b<30?'Fazla kilolu':'Obez'}
function fatCat(sex,f){const t=sex==='k'?[14,21,25,32]:sex==='e'?[6,14,18,25]:null;if(!t)return '';return f<t[0]?'Çok düşük':f<t[1]?'Atletik':f<t[2]?'Fit':f<t[3]?'Ortalama':'Yüksek'}
function latestMeas(k){const M=store.meas.filter(m=>m[k]!=null&&m[k]!=='').sort((a,b)=>a.date.localeCompare(b.date));return M.length?M[M.length-1]:null}
function bodyNow(){const b=Object.assign({},(store.profile&&store.profile.body)||{});['w','fat','muscle','neck','waist','hip'].forEach(k=>{const m=latestMeas(k);if(m){b[k]=+m[k];if(k==='fat')b.fatEst=!!m.fatEst}});return b}
function bodyCalc(b){const o={};if(b.by)o.age=new Date().getFullYear()-b.by;
  if(b.h&&b.w){o.bmi=Math.round(b.w/Math.pow(b.h/100,2)*10)/10;o.bmiCat=bmiCat(o.bmi)}
  if(b.fat!=null&&b.fat!==''&&!isNaN(b.fat)){o.fat=+b.fat;o.fatEst=!!b.fatEst}else{const e=navyFat(b.sex,b.h,b.waist,b.neck,b.hip);if(e!=null){o.fat=e;o.fatEst=true}}
  if(o.fat!=null){o.fatCat=fatCat(b.sex,o.fat);if(b.w)o.lean=Math.round(b.w*(1-o.fat/100)*10)/10}
  return o}
function bodyCalcTxt(b){const c=bodyCalc(b);const p=[];if(c.bmi)p.push('Vücut kitle indeksi <b>'+c.bmi+'</b> · '+c.bmiCat);if(c.fat!=null)p.push('Yağ oranı <b>%'+c.fat+'</b>'+(c.fatEst&&(b.fat==null||b.fat==='')?' (tahmini)':'')+(c.fatCat?' · '+c.fatCat:''));if(c.lean)p.push('Yağsız kütle <b>'+c.lean+' kg</b>');
  return p.length?p.join('<br>'):'Boy ve kilonu girince vücut kitle indeksini, boyun ve bel ölçünü de girersen yağ oranını hesaplarım.'}
function bodyForm(b){const f=(k,l,u,ph,st)=>'<label><span>'+l+(u?' <small>('+u+')</small>':'')+'</span><input type="number" inputmode="decimal" step="'+(st||'0.1')+'" id="bf_'+k+'" placeholder="'+(ph||'—')+'" value="'+(b[k]!=null&&b[k]!==''?esc(b[k]):'')+'"></label>';
  return '<div class="bsex" role="group" aria-label="Cinsiyet"><span class="flabel">Cinsiyet</span><div class="seg">'+[['k','Kadın'],['e','Erkek'],['x','Belirtmek istemiyorum']].map(([k,l])=>'<button data-bsex="'+k+'" aria-pressed="'+(b.sex===k)+'">'+l+'</button>').join('')+'</div></div>'+
   '<div class="mform">'+f('by','Doğum yılı','','örn. 1988','1')+f('h','Boy','cm','örn. 172','1')+f('w','Kilo','kg')+'</div>'+
   '<div class="sec" style="margin-top:18px">Biliyorsan</div><p class="muted" style="margin:-4px 0 8px;font-size:13px">Akıllı tartı ya da vücut analizi yaptırdıysan gir; yoksa boş bırak.</p><div class="mform">'+f('fat','Yağ oranı','%')+f('muscle','Kas kütlesi','kg')+'</div>'+
   '<div class="sec" style="margin-top:18px">Mezurayla (yağ oranı tahmini için)</div><p class="muted" style="margin:-4px 0 8px;font-size:13px">Yağ oranını bilmiyorsan boyun ve bel çevresinden (kadınlarda kalça da) tahmin ederim. Bel: göbek hizasından; boyun: gırtlağın hemen altından; kalça: en geniş yerden.</p><div class="mform">'+f('neck','Boyun çevresi','cm')+f('waist','Bel çevresi','cm')+f('hip','Kalça çevresi','cm')+'</div>'+
   '<div class="bcalc" id="bfCalc" aria-live="polite">'+bodyCalcTxt(b)+'</div>'}
function readBody(){BKEYS.forEach(k=>{const el=$('#bf_'+k);if(!el)return;if(el.value==='')delete BODYD[k];else BODYD[k]=+el.value})}
function bodyStep(){BODYD=OB.body;return '<span class="eyebrow">1 / 6 · Vücudun</span><h2 class="obh">Seni biraz tanıyalım</h2><p class="obp">Bu bilgiler gelişimini takip etmek ve önerileri sana göre ayarlamak için yalnızca senin kayıtlarında saklanır. İstemediğin alanı boş bırakabilirsin.</p>'+bodyForm(BODYD)}
function upsertMeasToday(vals){const keys=Object.keys(vals).filter(k=>vals[k]!=null&&vals[k]!=='');if(!keys.length)return Promise.resolve();const today=dkey(new Date());
  const ex=store.meas.find(m=>m.date.slice(0,10)===today);
  if(ex){Object.assign(ex,vals);saveMeas();if(store.db){try{const o=Object.assign({},ex);delete o.id;return store.db.collection('data/users/'+store.uid).doc(ex.id).set(o).catch(()=>{})}catch(e){}}return Promise.resolve()}
  return persistMeas(Object.assign({id:'m_'+Date.now().toString(36),date:today+'T12:00:00'},vals))}
function bodyMeasVals(b){const v={};['w','fat','muscle','neck','waist','hip'].forEach(k=>{if(b[k]!=null&&b[k]!=='')v[k]=+b[k]});if(v.fat==null){const e=navyFat(b.sex,b.h,b.waist,b.neck,b.hip);if(e!=null){v.fat=e;v.fatEst=1}}return v}
function saveBody(){const b=Object.assign({},BODYD);if(!store.profile)store.profile={};store.profile.body={sex:b.sex,by:b.by,h:b.h,w:b.w,fat:b.fat,muscle:b.muscle,neck:b.neck,waist:b.waist,hip:b.hip,updated:new Date().toISOString()};
  Object.keys(store.profile.body).forEach(k=>{if(store.profile.body[k]==null)delete store.profile.body[k]});saveProfile();return upsertMeasToday(bodyMeasVals(b)).then(()=>checkRecords())}
function sheetBody(){BODYD=Object.assign({},(store.profile&&store.profile.body)||{},bodyNow());delete BODYD.fatEst;if(bodyNow().fatEst)delete BODYD.fat;
  openSheet('<h2>Vücut bilgilerin</h2><p class="muted" style="margin:6px 0 14px">Güncel değerlerini gir. Kilo, yağ oranı, kas kütlesi ve çevre ölçüleri bugünün ölçümü olarak da kaydedilir; gelişimini Geçmiş sekmesinde görürsün.</p>'+bodyForm(BODYD)+
  '<div class="actions"><button class="btn ghost" data-close>Vazgeç</button><button class="btn" data-bodysave="1">Kaydet</button></div>')}
function bodyCard(){const pb=store.profile&&store.profile.body;
  if(!pb||(!pb.h&&!pb.w)) return '<h2 class="h2">Vücudun</h2><div class="mrem"><div><span class="eyebrow">Vücut bilgileri</span><b>Cinsiyet, yaş, boy ve kilonu ekle</b><span class="muted">Vücut kitle indeksi, yağ oranı ve yağsız kütle hesaplanır; her ölçümde değişimini görürsün.</span></div><button class="btn sm" data-bodyedit="1">Ekle</button></div>';
  const b=bodyNow(),c=bodyCalc(b);const first=store.meas.slice().sort((a,b2)=>a.date.localeCompare(b2.date));
  const fw=first.find(m=>m.w!=null&&m.w!==''),ff=first.find(m=>m.fat!=null&&m.fat!=='');
  const dl=(a,bv,u)=>{if(a==null||bv==null)return '';const d=+(bv-a).toFixed(1);return d===0?'':'<span class="md">'+(d>0?'+':'')+d+' '+u+' · başlangıçtan</span>'};
  const tile=(l,v,u,sub)=>'<div class="rec"><span class="ml">'+l+'</span><b class="num">'+v+(u?' <small>'+u+'</small>':'')+'</b>'+(sub||'')+'</div>';
  return '<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:28px 0 12px"><h2 class="h2" style="margin:0">Vücudun</h2><button class="btn sm ghost" data-bodyedit="1">Güncelle</button></div>'+
   '<p class="muted" style="margin:-4px 0 10px;font-size:13.5px">'+[b.sex==='k'?'Kadın':b.sex==='e'?'Erkek':'',c.age?c.age+' yaş':'',b.h?b.h+' cm':''].filter(Boolean).join(' · ')+'</p><div class="recs">'+
   (b.w?tile('Kilo',b.w,'kg',dl(fw&&+fw.w,b.w,'kg')):'')+
   (c.bmi?tile('Vücut kitle indeksi',c.bmi,'','<span class="md">'+c.bmiCat+'</span>'):'')+
   (c.fat!=null?tile('Yağ oranı'+(c.fatEst?' (tahmini)':''),'%'+c.fat,'','<span class="md">'+(c.fatCat||'')+'</span>'+dl(ff&&+ff.fat,c.fat,'puan')):'')+
   (c.lean?tile('Yağsız kütle',c.lean,'kg'):'')+
   (b.muscle?tile('Kas kütlesi',b.muscle,'kg'):'')+'</div>'+
   '<p class="muted" style="font-size:12px;margin:8px 2px 0">Vücut kitle indeksi kaslı kişilerde yanıltıcı olabilir. Tahmini yağ oranı ABD Donanması mezura yöntemiyle hesaplanır, birkaç puan sapabilir; aynı koşullarda ölçüp eğilimi izlemek daha anlamlıdır.</p>'}
function bodyPrompt(){const pr=store.profile;if(!pr||!pr.done||(pr.body&&(pr.body.h||pr.body.w)))return '';return '<div class="mrem"><div><span class="eyebrow">Gelişim takibi</span><b>Vücut bilgilerini ekle</b><span class="muted">Cinsiyet, yaş, boy, kilo ve istersen yağ oranı; gelişimini rakamlarla izle.</span></div><button class="btn sm" data-bodyedit="1">Ekle</button></div>'}
function bodyTxt(){const b=bodyNow(),c=bodyCalc(b);const p=[];if(b.sex==='k')p.push('kadın');if(b.sex==='e')p.push('erkek');if(c.age)p.push(c.age+' yaş');if(b.h)p.push(b.h+' cm');if(b.w)p.push(b.w+' kg');if(c.bmi)p.push('VKİ '+c.bmi);if(c.fat!=null)p.push('yağ oranı %'+c.fat+(c.fatEst?' (tahmini)':''));if(b.muscle)p.push('kas kütlesi '+b.muscle+' kg');return p.length?' Vücut: '+p.join(', ')+'.':''}

function startIdx(lid){const pr=store.profile;if(!pr||!pr.test||!LADDER_START[lid])return -1;return LADDER_START[lid][pr.test[LADDER_AREA[lid]]||0]}
syncCustoms();
render();
initAI();
setTimeout(()=>{if(!lsGet('pd.recs',null))checkRecords()},2500);
Promise.resolve(initDb()).finally(()=>setTimeout(()=>{if(!lsGet('pd.onbskip',false))maybeOnboard()},1400));
})();
</script>

if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
